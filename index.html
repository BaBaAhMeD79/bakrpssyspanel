<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تراخيص - Bakr PS System</title>
    <style>
        body { background-color: #18191c; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: auto; background: #202225; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-top: 40px; }
        h2 { color: #f1c40f; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #dcddde; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4f545c; background: #2f3136; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gen { background-color: #2ecc71; color: white; }
        .btn-gen:hover { background-color: #27ae60; }
        .list-section { margin-top: 30px; }
        .key-card { background: #2f3136; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-right: 5px solid #2ecc71; display: flex; justify-content: space-between; align-items: center; }
        .key-info div { font-size: 14px; color: #b9bbbe; margin-top: 3px; }
        .key-title { font-size: 16px; font-weight: bold; color: #f1c40f; }
        .actions button { padding: 6px 12px; font-size: 13px; width: auto; margin-left: 5px; border-radius: 4px; }
        .btn-reset { background-color: #e67e22; color: white; }
        .btn-del { background-color: #e74c3c; color: white; }
        
        /* ستايل شاشة اللوجن */
        #loginScreen { max-width: 400px; margin: 80px auto; background: #202225; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        #loginScreen input { margin-bottom: 15px; }
        .btn-login { background-color: #5865F2; color: white; }
        .error-msg { color: #e74c3c; margin-top: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <h2>🔐 تسجيل دخول الأدمن</h2>
        <div class="form-group" style="text-align: right;">
            <label>اسم المستخدم:</label>
            <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>كلمة المرور:</label>
            <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn-login" onclick="checkLogin()">دخول للبانل 🚀</button>
        <div id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية لحين تسجيل الدخول) -->
    <div class="container" id="mainPanel" style="display: none;">
        <h2>🔑 لوحة تحكم وتوليد الأكواد السحابية</h2>
        
        <div class="form-group">
            <label>كود التفعيل (اتركه فارغاً للتوليد التلقائي):</label>
            <input type="text" id="customKey" placeholder="مثال: BAKR-VIP-001">
        </div>

        <div class="form-group">
            <label>المدة الزمنية:</label>
            <select id="durationType">
                <option value="Trial1Day">يوم تجريبي (Trial)</option>
                <option value="1Month" selected>شهر واحد (1 Month)</option>
                <option value="6Months">6 شهور (6 Months)</option>
                <option value="1Year">سنة كاملة (1 Year)</option>
                <option value="Lifetime">مدى الحياة (Lifetime)</option>
            </select>
        </div>

        <div class="form-group">
            <label>عدد الأجهزة المسموحة:</label>
            <input type="number" id="maxDevices" value="1" min="1" max="10">
        </div>

        <button class="btn-gen" onclick="generateKey()">إنشاء وتوليد الكود 🚀</button>

        <div class="list-section">
            <h3 style="color: #00b0f4;">📋 الأكواد المسجلة أونلاين:</h3>
            <div id="keysContainer">جاري تحميل الأكواد... ⏳</div>
        </div>
        <button style="background: #e74c3c; margin-top: 30px;" onclick="logout()">تسجيل الخروج 🔒</button>
    </div>

<script>
    // البيانات المعتمدة للأدمن من السيستم
    const correctUser = "BAKR";
    const correctPass = "BaBaAhMeD1102003@";

    function checkLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();

        if(u === correctUser && p === correctPass) {
            sessionStorage.setItem("isLoggedIn", "true");
            showPanel();
        } else {
            document.getElementById('errorMsg').style.display = "block";
        }
    }

    function showPanel() {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('mainPanel').style.display = "block";
        loadKeys();
    }

    function logout() {
        sessionStorage.removeItem("isLoggedIn");
        location.reload();
    }

    // أول ما الصفحة تفتح، لو مسجل دخول قبل كده يدخل علطول
    window.onload = function() {
        if(sessionStorage.getItem("isLoggedIn") === "true") {
            showPanel();
        }
    };

    // 🔗 حط رابط فايربيز والـ Secret Key بتوعك هنا
    const firebaseURL = "https://bakr-ps-system-default-rtdb.firebaseio.com/licenses";
    const firebaseSecret = "YOUR_DATABASE_SECRET_KEY_HERE";

    async function generateKey() {
        let key = document.getElementById('customKey').value.trim();
        if(!key) {
            key = "BAKR-" + Math.random().toString(36).substring(2, 10).toUpperCase();
        } else {
            key = key.toUpperCase();
        }

        const duration = document.getElementById('durationType').value;
        const maxDevs = parseInt(document.getElementById('maxDevices').value);

        const data = {
            duration_type: duration,
            max_devices: maxDevs,
            bound_hwids: "",
            is_active: true
        };

        try {
            let res = await fetch(`${firebaseURL}/${key}.json?auth=${firebaseSecret}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert("تم إنشاء وتوليد الكود بنجاح: " + key);
                document.getElementById('customKey').value = "";
                loadKeys();
            } else {
                alert("فشل حفظ الكود!");
            }
        } catch(e) {
            alert("خطأ في الاتصال: " + e.message);
        }
    }

    async function loadKeys() {
        let container = document.getElementById('keysContainer');
        container.innerHTML = "جاري التحميل... ⏳";
        try {
            let res = await fetch(`${firebaseURL}.json?auth=${firebaseSecret}`);
            let data = await res.json();

            container.innerHTML = "";
            if(!data) {
                container.innerHTML = "لا توجد أي أكواد مسجلة بعد.";
                return;
            }

            for(let key in data) {
                let item = data[key];
                let boundText = item.bound_hwids ? `مربوط بجهاز: ${item.bound_hwids}` : `غير مربوط بجهاز (متاح)`;
                let statusColor = item.is_active ? "#2ecc71" : "#e74c3c";

                container.innerHTML += `
                    <div class="key-card" style="border-right-color: ${statusColor}">
                        <div class="key-info">
                            <div class="key-title">🔑 ${key}</div>
                            <div>المدة: ${item.duration_type} | الأجهزة: ${item.max_devices}</div>
                            <div style="color: #00b0f4;">${boundText}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-reset" onclick="resetKey('${key}')">فك الجهاز 🔄</button>
                            <button class="btn-del" onclick="deleteKey('${key}')">حذف ❌</button>
                        </div>
                    </div>
                `;
            }
        } catch(e) {
            container.innerHTML = "فشل جلب الأكواد من السيرفر.";
        }
    }

    async function resetKey(key) {
        if(confirm(`هل تريد فك ربط الماكينة للكود ${key}؟`)) {
            await fetch(`${firebaseURL}/${key}/bound_hwids.json?auth=${firebaseSecret}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify("")
            });
            loadKeys();
        }
    }

    async function deleteKey(key) {
        if(confirm(`هل أنت متأكد من حذف الكود ${key} نهائياً؟`)) {
            await fetch(`${firebaseURL}/${key}.json?auth=${firebaseSecret}`, { method: 'DELETE' });
            loadKeys();
        }
    }
</script>

</body>
</html>
